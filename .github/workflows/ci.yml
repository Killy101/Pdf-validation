name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unused code, tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Ruff (unused imports and variables, likely bugs)
        run: python -m ruff check --output-format github
      - name: Vulture (unused code)
        run: python -m vulture backend/app backend/run_server.py --min-confidence 100
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  shell:
    name: Desktop shell (types)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:electron

  duplication:
    name: Duplicated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes jscpd@4 backend frontend/src frontend/tests electron/src scripts tests
